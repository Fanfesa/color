; Pearlescent Colors - edit file ini ini, perubahan dimuat otomatis tiap ~1 detik saat game jalan.
; Taruh di folder config AML (sama dengan config plugin lain).

[settings]
; enabled: 1 = efek aktif, 0 = mati (diatur juga dari menu)
enabled=1
; autosave: 1 = menu menyimpan semua perubahan otomatis ke file ini
autosave=1
; mode = all       -> semua mobil memakai template active (mobil di [cars] memakai template khusus)
; mode = whitelist -> HANYA mobil yang terdaftar di [cars] yang berwarna pearlescent
mode=all
; shift_mode: pixel = efek per piksel lewat shader (paling mirip cat bunglon; ganti setting butuh restart game), angle = warna berubah menurut sudut kamera-mobil (pearlescent), time = berdasarkan waktu, both = gabungan
shift_mode=pixel
; angle_gain: makin besar makin banyak pergantian warna saat mengelilingi mobil (1.0 = satu siklus penuh)
angle_gain=2.0
; ----- khusus mode pixel (ubah lalu RESTART game) -----
; shader_patch: 1 = aktifkan patch shader, 0 = matikan (jika game bermasalah)
shader_patch=1
; cham_gain: seberapa cepat warna berganti menurut sudut pandang terhadap permukaan
cham_gain=1.6
; cham_flow: pengaruh arah pantulan (atas/bawah) pada gradasi
cham_flow=0.25
; cham_bias: geser awal gradasi (-0.5 s/d 0.5)
cham_bias=0.0
; cham_reflect: pantulan minimum (clearcoat/kilap) 0.0 - 0.6. Makin besar makin mengkilap
cham_reflect=0.22
; cham_fresnel: tambahan pantulan di tepi lengkungan body (efek kilap realistis)
cham_fresnel=0.5
; cham_depth: kedalaman/ gelap dasar cat. 0 = rata, 0.5 = kontras tinggi
cham_depth=0.25
; cham_flake: butiran metalik halus (glitter). 0 = mati
cham_flake=0.08
; cham_brightness: kecerahan total warna (kurangi jika terlalu pucat)
cham_brightness=0.9
; ----- menu in-game (tombol "PC" di layar) -----
; menu: 1 = aktif, 0 = matikan menu
menu=1
; menu_scale: ukuran tampilan menu. 0 = otomatis. Naikkan jika terlalu kecil
menu_scale=0
; posisi tombol menu (0.0 - 1.0 dari lebar/tinggi layar)
menu_button_x=0.44
menu_button_y=0.02
; part_spread: perbedaan warna antar bagian body (kap, pintu, bumper). 0 = semua sama, makin besar makin beda
part_spread=2.5
; elev_gain: pengaruh sudut atas/bawah kamera
elev_gain=1.5
; active = nama template (tulis "custom" untuk mix manual)
active=Purple-Blue-Green
; kecepatan pergeseran warna (siklus per detik), 0 = diam
speed=0.5
; pengali intensitas global 0.0 - 1.0
intensity=1.0

; ===== PILIH MOBIL =====
; format: namaModel=template  (nama model dari DFF, mis. buffalo) atau ID=template (mis. 402=Sunset)
; template boleh "custom". Hapus tanda ; di depan untuk mengaktifkan.
[cars]
;buffalo=Purple-Gold
;infernus=custom

; ===== MIX MANUAL: ubah a dan b (R,G,B 0-255), lalu set active=custom =====
[custom]
a=40,120,255
b=255,60,200
intensity=1.0

; ===== TEMPLATE CHAMELEON =====
