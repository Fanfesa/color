; Pearlescent Colors - edit file ini ini, perubahan dimuat otomatis tiap ~1 detik saat game jalan.
; Taruh di folder config AML (sama dengan config plugin lain).

[settings]
; active = nama template (tulis "custom" untuk mix manual)
active=Purple-Gold
; kecepatan pergeseran warna (siklus per detik), 0 = diam
speed=0.5
; pengali intensitas global 0.0 - 1.0
intensity=1.0

; ===== MIX MANUAL: ubah a dan b (R,G,B 0-255), lalu set active=custom =====
[custom]
a=40,120,255
b=255,60,200
intensity=1.0

; ===== TEMPLATE =====
[template:Purple-Gold]
a=120,40,200
b=230,180,60
[template:Blue-Green]
a=20,80,220
b=20,220,150
[template:Red-Orange]
a=200,20,40
b=255,140,20
[template:Pink-Cyan]
a=255,100,200
b=80,220,255
[template:Black-Violet]
a=15,15,25
b=120,60,200
[template:White-Pearl]
a=245,245,250
b=200,170,230
[template:Emerald-Gold]
a=10,110,70
b=220,190,70
[template:Sunset]
a=255,80,60
b=160,60,220
